patterns:
  python:
    - '^\s*class\s+\w+'
    - '^\s*def\s+\w+'
  javascript:
    - '^\s*(export\s+)?class\s+\w+'
    - '^\s*(export\s+)?(async\s+)?function\s+\w+'
    - '^\s*(export\s+)?(const|let|var)\s+\w+\s*=\s*(async\s+)?\([^)]*\)\s*=>'
  typescript:
    - '^\s*(export\s+)?class\s+\w+'
    - '^\s*(export\s+)?(async\s+)?function\s+\w+'
    - '^\s*(export\s+)?(const|let|var)\s+\w+\s*=\s*(async\s+)?\([^)]*\)\s*=>'
    - '^\s*interface\s+\w+'
    - '^\s*type\s+\w+\s*='
  tsx:
    - '^\s*(export\s+)?class\s+\w+'
    - '^\s*(export\s+)?(async\s+)?function\s+\w+'
    - '^\s*(export\s+)?(const|let|var)\s+\w+\s*=\s*\([^)]*\)\s*=>'
    - '^\s*interface\s+\w+'
    - '^\s*type\s+\w+\s*='
  jsx:
    - '^\s*(export\s+)?class\s+\w+'
    - '^\s*(export\s+)?(async\s+)?function\s+\w+'
    - '^\s*(export\s+)?(const|let|var)\s+\w+\s*=\s*\([^)]*\)\s*=>'
  go:
    - '^\s*func\s+(?:\([^)]*\)\s*)?\w+'
    - '^\s*type\s+\w+\s+(struct|interface)\b'
  java:
    - '^\s*(public|protected|private)?\s*(class|interface|enum)\s+\w+'
  kotlin:
    - '^\s*(data\s+)?class\s+\w+'
    - '^\s*fun\s+\w+'
    - '^\s*interface\s+\w+'
  scala:
    - '^\s*(class|trait|object)\s+\w+'
    - '^\s*def\s+\w+'
  csharp:
    - '^\s*(public|protected|private)?\s*(class|interface|enum|record|struct)\s+\w+'
    - '^\s*(public|protected|private)?\s*(static\s+)?\w+\s+\w+\s*\('
  ruby:
    - '^\s*class\s+\w+'
    - '^\s*module\s+\w+'
    - '^\s*def\s+\w+'
  php:
    - '^\s*(class|interface|trait)\s+\w+'
    - '^\s*function\s+\w+'
  rust:
    - '^\s*(pub\s+)?(struct|enum|trait|fn)\s+\w+'
  bash:
    - '^\s*function\s+\w+'
    - '^\s*\w+\s*\(\)\s*\{'
  markdown:
    - '^\s{0,3}#{1,6}\s+.+'
  makefile:
    - '^[A-Za-z0-9_.-]+:\s*'
